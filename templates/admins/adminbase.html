{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Smart Rural Classification</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

   <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url("{% static 'imgs/ks.png' %}") no-repeat center center/cover;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;

      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 25px;
    }

    header div {
      display: flex;
      align-items: center;
      position: relative;
      max-width: 1200px;
      margin: auto;
    }
    .navbar-brand {
      color: white;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      z-index: 2;
      letter-spacing: 0.3px;
    }

    .navbar-brand span {
      color: #00c6ff;
    }

    /* CENTER NAV */
    nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: 0.3s ease;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 8px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: rgba(255,255,255,0.8);
      padding: 9px 18px;
      border-radius: 10px;
      transition: all 0.3s ease;
      font-size: 14px;
      font-weight: 500;
    }

    nav ul li a:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .active {
      background: linear-gradient(135deg, #007bff, #00c6ff) !important;
      color: #fff !important;
      box-shadow: 0 4px 15px rgba(0,123,255,0.3);
    }
    .logout-btn {
      background: transparent !important;
      border: 1px solid rgba(220,53,69,0.5);
      color: #ff6b6b !important;
    }
    .logout-btn:hover {
      background: rgba(220,53,69,0.15) !important;
      border-color: #dc3545;
    }
    .menu-toggle {
      margin-left: auto;
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      display: none;
      z-index: 2;
    }
    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
      nav {
        position: absolute;
        top: 55px;
        right: 10px;
        left: auto;
        transform: none;
        background: rgba(0, 0, 0, 0.92);
        width: 220px;
        border-radius: 12px;
        display: none;
        flex-direction: column;
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      nav ul {
        flex-direction: column;
        gap: 5px;
      }
      nav.show-menu {
        display: flex;
      }
    }
    .content {
      margin-top: 80px;
      padding: 20px;
      flex: 1;
      color: white;
    }
    .message-box {
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 18px;
      margin-bottom: 10px;
      border-radius: 10px;
      border-left: 3px solid #00c6ff;
      font-size: 14px;
      color: #fff;
    }
    footer {
      text-align: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.7);
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    footer span {
      color: #00c6ff;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <a class="navbar-brand" href="{% url 'AdminHome' %}">
        🌾 Smart <span>Rural</span> Classification
      </a>
      <nav id="nav-menu">
        <ul>
          <li>
            <a href="{% url 'AdminHome' %}" class="{% block dash_active %}{% endblock %}">
              Dashboard
            </a>
          </li>
          <li>
            <a href="{% url 'ViewRegisteredUsers' %}" class="{% block users_active %}{% endblock %}">
              Users
            </a>
          </li>
          <li>
            <a href="{% url 'AdminLogout' %}" class="logout-btn">
              Logout
            </a>
          </li>
        </ul>
      </nav>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>
  </header>
  <div class="content">
    {% block content %}
      {% if messages %}
        {% for message in messages %}
          <div class="message-box">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endblock %}
  </div>
  <script>
    function toggleMenu() {
      document.getElementById("nav-menu").classList.toggle("show-menu");
    }
  </script>
  <footer>
    <p>&copy; <span>Smart Rural Classification</span>. All rights reserved.</p>
  </footer>
</body>
</html>
